<!DOCTYPE html>
<html>
<head>
<style>
table {
  font-family: arial, sans-serif;
  border-collapse: collapse;
  width: 100%;
}
table:hover{
    color: red;
    background-color: orange;
    font-weight: bold;
    border-radius: 15px;
    font-family: Arial, Helvetica, sans-serif;
    border-color: orange;
}
h2:hover{
    background-color: red;
    color: white;
    font-family: verdana;
    font-weight: bold;
    text-decoration: underline;
    text-align: center;
    text-transform: uppercase;
    font-size: 50px;
}

td, th {
  border: 1px solid #dddddd;
  text-align: left;
  padding: 8px;
}

tr:nth-child(even) {
  background-color: #dddddd;
}
</style>
</head>
<body>

<h2>Table Design using HTML and CSS</h2>
<marquee>
<table>
  <tr>
    <th>Company</th>
    <th>Contact</th>
    <th>Country</th>
  </tr>
  <tr>
    <td>Safaricom</td>
    <td>Ezekiel</td>
    <td>Kenya</td>
  </tr>
  <tr>
    <td>Telkom</td>
    <td>Munyendo</td>
    <td>Uganda</td>
  </tr>
  <tr>
    <td>Airtel</td>
    <td>Ateya</td>
    <td>Tanzania</td>
  </tr>
  <tr>
    <td>Online Trading</td>
    <td>Helen</td>
    <td>South Africa</td>
  </tr>
  <tr>
    <td>Oil refinary</td>
    <td>Dangote</td>
    <td>Nigeria</td>
  </tr>
  <tr>
    <td>Vehicle Manufacturing</td>
    <td>Traore</td>
    <td>Burkina Faso</td>
  </tr>
</table>
</marquee>

</body>
</html>
